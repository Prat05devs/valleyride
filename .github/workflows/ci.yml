name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test --filter=!@valleyride/web...
      - run: pnpm turbo run lint typecheck --filter=@valleyride/web

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: valley, POSTGRES_PASSWORD: valley, POSTGRES_DB: valleyride_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U valley" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://valley:valley@localhost:5432/valleyride_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@valleyride/shared
      - run: pnpm --filter @valleyride/api db:migrate
      - run: pnpm --filter @valleyride/api db:seed
      - run: pnpm --filter @valleyride/api test:integration
