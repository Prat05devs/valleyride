# Local services: docker compose -f infra/docker-compose.yml up -d   (or: pnpm infra:up)
name: valleyride

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: valley
      POSTGRES_PASSWORD: valley
      POSTGRES_DB: valleyride
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valley -d valleyride"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

volumes:
  pgdata:
