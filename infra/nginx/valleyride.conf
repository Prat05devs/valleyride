# Cloudflare (DNS, CDN, WAF) → this Nginx → Next.js and Express.
# TLS uses a Cloudflare origin certificate; set Cloudflare SSL mode to "Full (strict)".

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream web { server 127.0.0.1:3000; keepalive 16; }
upstream api { server 127.0.0.1:4000; keepalive 16; }

map $http_cf_connecting_ip $client_ip { default $http_cf_connecting_ip; "" $remote_addr; }

server {
  listen 80;
  server_name valleyride.in www.valleyride.in api.valleyride.in;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name valleyride.in www.valleyride.in;

  ssl_certificate     /etc/ssl/cloudflare/valleyride.in.pem;
  ssl_certificate_key /etc/ssl/cloudflare/valleyride.in.key;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.valleyride.in;

  ssl_certificate     /etc/ssl/cloudflare/valleyride.in.pem;
  ssl_certificate_key /etc/ssl/cloudflare/valleyride.in.key;

  client_max_body_size 2m; # KYC files go straight to S3 via pre-signed URLs, not through the API
  gzip on;
  gzip_types application/json;

  location / {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
  }
}
